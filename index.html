      <span class="toolbar-label" style="font-weight:600;color:#003179">15 Sep 2026</span>
      <span class="divider"></span>
      <div class="show-control"><span class="toolbar-label">Show</span><button type="button" class="show-chip">Placements</button></div>
      <span class="divider"></span>
      <div class="group-by-control">
        <span class="toolbar-label">Group availability by</span>
        <select class="group-by-field is-none" id="groupAvailBy" title="Groups the availability/capacity rows only (region/facility/department/ward) - does not affect how requests are displayed">
          <option value="none" selected>None</option>
          <option value="region">Region</option>
          <option value="facility">Facility</option>
          <option value="department">Department</option>
          <option value="ward">Ward</option>
        </select>
      </div>
      <span class="divider"></span>
      <div class="group-by-control">
        <span class="toolbar-label">Group requests by</span>
        <select class="group-by-field" id="groupReqBy" onchange="onGroupReqByChange(this.value)">
          <option value="none">None</option>
          <option value="ep" selected>EP</option>
          <option value="ep_campus">EP &amp; Campus</option>
        </select>
      </div>
    </div>
    <div class="toolbar-right">
      <div class="rag-legend">
        <span class="rag-leg-item"><span class="rag-leg-dot rag-green"></span>Fits</span>
        <span class="rag-leg-item"><span class="rag-leg-dot rag-amber"></span>Partial</span>
        <span class="rag-leg-item"><span class="rag-leg-dot rag-red"></span>No capacity</span>
      </div>
      <button class="expand-all-btn" onclick="toggleExpandAll()" id="expandAllBtn">Expand</button>
    </div>
  </div>

  <div class="grid-table" id="gridTable" role="grid">
    <div class="grid-row grid-header" role="row" id="gridHeaderRow"></div>
    <div class="grid-viewport" id="gridViewport"></div>
  </div>
</div>

<div id="reqTooltip">
  <div class="tt-head"><span class="tt-id" id="ttId"></span><span class="tt-sbadge" id="ttStatus"></span></div>
  <div class="tt-row" id="ttEPRow"><span class="tt-lbl">EP / Campus</span><span class="tt-val" id="ttEP"></span></div>
  <div class="tt-row"><span class="tt-lbl">Discipline</span><span class="tt-val" id="ttDisc"></span></div>
  <div class="tt-row"><span class="tt-lbl">Placement Type</span><span class="tt-val" id="ttType"></span></div>
  <div class="tt-row"><span class="tt-lbl">Year Level</span><span class="tt-val" id="ttYear"></span></div>
  <div class="tt-row" id="ttQtyRow"><span class="tt-lbl">Number of Placements</span><span class="tt-val" id="ttQty"></span></div>
  <div class="tt-row"><span class="tt-lbl">Duration</span><span class="tt-val" id="ttDur"></span></div>
  <div class="tt-row"><span class="tt-lbl">Date Range</span><span class="tt-val" id="ttDates"></span></div>
  <div class="tt-progress" id="ttProgressWrap" style="display:none">
    <div class="tt-progress-bar"><span class="tt-progress-fill" id="ttProgressFill" style="width:0%"></span></div>
    <div class="tt-progress-labels"><span id="ttAllocatedLbl"></span><span id="ttRemainingLbl"></span></div>
  </div>
</div>

<script>
/* ============================================================
   Data — Victoria region, matching real production values where
   captured in the QA DOM dump (RG_QA.txt). R-100546 is the real,
   currently-broken Any (qty:0) request. A second Any request is
   added into the real "ACU 2 Requests" group under 03-2300 to
   demonstrate the shared-group amber case on real data.
   ============================================================ */
const BASE = new Date(2026, 8, 15); // 15 Sep 2026
const DAYS = 28;
const CAP_VIC = [709,720,715,727,117,123,696,701,705,705,706,116,122,714,715,719,707,708,116,118,693,695,700,699,701,111,123,694];

function isWknd(d){ const g=d.getDay(); return g===0||g===6; }
function getDate(i){ const d=new Date(BASE); d.setDate(d.getDate()+i); return d; }
function fmtDate(d){ return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`; }
function fmtDow(d){ return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()]; }
function parseDMY(s){ const [dd,mm,yyyy]=s.split('/').map(Number); return new Date(yyyy,mm-1,dd); }
function parseRange(dates){
  if(!dates) return null;
  const [a,b]=dates.split(' - ');
  return { start: parseDMY(a.trim()), end: parseDMY(b.trim()) };
}

const AGENCIES = [
  { id:'sa-c', name:'(SA) Agency C',
    caps:[22,33,23,33,3,3,5,5,5,5,5,null,null,10,10,10,-2,-2,null,null,-3,-3,-3,-3,-3,null,null,-3],
    reqs: [
      {id:'r100165', reqNum:'R-100165', ep:'ACU', campus:'Adelaide', qty:3, allocated:2,
       discipline:'Nursing', type:'General Medical', year:'Yr 2', dur:'', dates:'01/09/2026 - 31/10/2026'},
      {id:'r100425', reqNum:'R-100425', ep:'Canberra', campus:'Other', qty:4, allocated:3,
       discipline:'Nursing', type:'General Medical', year:'Yr 2', dur:'', dates:'01/09/2026 - 31/10/2026'},
    ] },
  { id:'g03', name:'03-2300',
    caps:[1,1,0,1,7,12,3,0,0,-1,0,7,12,3,0,0,4,5,7,12,6,6,5,4,6,7,12,8],
    reqs: [
      {id:'r100396', reqNum:'R-100396', ep:'ACU', campus:'Adelaide', qty:7, allocated:4,
       discipline:'Midwifery', type:'Antenatal', year:'Yr 2', dur:'10 Day(s)', dates:'01/09/2026 - 31/12/2026'},
      {id:'r100397', reqNum:'R-100397', ep:'ACU', campus:'Adelaide', qty:4, allocated:1,
       discipline:'Nursing', type:'General Medical', year:'Yr 2', dur:'', dates:'01/09/2026 - 31/12/2026'},
      // Demo: a second Any request joining the real ACU group above.
      // Real sum on active days is 3 (7-4) + 3 (4-1) = 6 -> aggregate should
      // read "6+" once this is added; needed for colour purposes becomes
      // 6 + 1 (this request) = 7, compared against 03-2300's real capacity.
      {id:'r-any-acu-join', reqNum:'R-95301', ep:'ACU', campus:'Adelaide', qty:0, allocated:0,
       discipline:'Nursing', type:'General Medical', year:'Yr 2', dur:'', dates:'01/09/2026 - 31/12/2026',
       comment:'Demo: open-ended request joining the real ACU group'},
      // R-100546 — the real, currently-broken Any request from production
      // (QA dump shows "0/0", plain "0" day cells, no RAG colour at all).
      {id:'r100546', reqNum:'R-100546', ep:'Canberra', campus:'Other', qty:0, allocated:0,
       discipline:'Nursing', type:'General Medical', year:'Yr 2', dur:'', dates:'15/09/2026 - 31/10/2026'},
      // Demo: same Canberra Any request shape, but already 5/Any — shows the
      // hover tooltip's "5 of Any placements processed" state, and the
      // ellipsis menu's "Close request" (since something's now allocated).
      {id:'r-any-5-progress', reqNum:'R-95302', ep:'Canberra', campus:'Other', qty:0, allocated:5,
       discipline:'Nursing', type:'General Medical', year:'Yr 2', dur:'', dates:'01/09/2026 - 31/12/2026',
       comment:'Demo: open-ended request already 5/Any allocated'},
    ] },
];

const REQ_META = {};
AGENCIES.forEach(ag => ag.reqs.forEach(r => { REQ_META[r.id] = r; r._agencyId = ag.id; }));

let groupReqBy = 'ep';       // none | ep | ep_campus
let expandedAgencies = {};   // id -> bool
let expandedEpGroups = {};   // key -> bool
let allExpanded = false;
let _activeReqMenu = null;

function onRegionChange(){ loadGrid(); }
function loadGrid(){ render(); }
function toggleAgency(id){ expandedAgencies[id] = !expandedAgencies[id]; render(); }
function toggleEp(key){ expandedEpGroups[key] = !expandedEpGroups[key]; render(); }
function onGroupReqByChange(val){ groupReqBy = val; render(); }
function toggleExpandAll(){
  allExpanded = !allExpanded;
  expandedAgencies = {}; expandedEpGroups = {};
  document.getElementById('expandAllBtn').textContent = allExpanded ? 'Collapse' : 'Expand';
  render();
}
function isAgencyExpanded(id){ return id in expandedAgencies ? expandedAgencies[id] : allExpanded; }
function isEpExpanded(key){ return key in expandedEpGroups ? expandedEpGroups[key] : allExpanded; }

function getCapacityForRequest(agency, dayIdx){ return agency.caps ? agency.caps[dayIdx] : null; }

/* Shared pool tracking not needed in Request Grid — no allocate action here,
   only "Process" (navigates to Process Request, where the shared 100-pool
   logic already lives). RG's scope is display + Reassign/Close only. */

function requestOpen(r){ return (r.qty||0) - (r.allocated||0); }
function requestIsAny(r){ return (r.qty||0) === 0; }
function requestHasCellOnDay(r, i){
  const range = parseRange(r.dates);
  if(!range) return true;
  const d = getDate(i);
  return d >= range.start && d <= range.end;
}

function renderHeader(){
  let h = `<div role="columnheader" class="grid-cell agency-cell agency-header">Agency</div>`;
  for(let i=0;i<DAYS;i++){
    const d = getDate(i);
    h += `<div role="columnheader" class="grid-cell date-header${isWknd(d)?' weekend':''}"><span class="date-primary">${fmtDate(d)}</span><span class="date-secondary">${fmtDow(d)}</span></div>`;
  }
  document.getElementById('gridHeaderRow').innerHTML = h;
  document.getElementById('gridHeaderRow').setAttribute('style', `--col-count:${DAYS}`);
  document.getElementById('gridTable').style.setProperty('--col-count', DAYS);
}

function renderRegionRow(){
  let h = `<div role="row" class="grid-row row-region"><div role="rowheader" class="grid-cell agency-cell" style="padding-left:8px"><span class="agency-name has-children" title="Victoria">Victoria</span></div>`;
  for(let i=0;i<DAYS;i++){
    const wknd = isWknd(getDate(i));
    const v = CAP_VIC[i];
    h += `<div role="gridcell" class="grid-cell day-cell${wknd?' weekend':''}"><span class="capacity-current-only${v===0?' capacity-zero':''}">${v}</span></div>`;
  }
  return h + '</div>';
}

function renderAgencyRow(ag){
  const hasReqs = ag.reqs.length > 0;
  const expanded = hasReqs && isAgencyExpanded(ag.id);
  const toggle = hasReqs
    ? `<button type="button" class="toggle-btn" onclick="toggleAgency('${ag.id}')"><i class="fas fa-chevron-down${expanded?'':' collapsed'}"></i></button>`
    : `<span aria-hidden="true" class="toggle-btn toggle-disabled"><i class="fas fa-chevron-down"></i></span>`;
  let h = `<div role="row" class="grid-row row-undefined"><div role="rowheader" class="grid-cell agency-cell" style="padding-left:8px">${toggle}<span class="agency-name${hasReqs?' has-children':''}" title="${ag.name}">${ag.name}</span></div>`;
  for(let i=0;i<DAYS;i++){
    const wknd = isWknd(getDate(i));
    const v = ag.caps ? ag.caps[i] : null;
    h += `<div role="gridcell" class="grid-cell day-cell${wknd?' weekend':''}">${v===null||v===undefined?'':`<span class="capacity-current-only${v===0?' capacity-zero':''}">${v}</span>`}</div>`;
  }
  h += '</div>';
  if(expanded){
    if(groupReqBy === 'none'){
      // No EP grouping row at all — requests sit directly under the agency,
      // one indent level in (matches production's "None" behaviour).
      ag.reqs.forEach(r => { h += renderRequestRow(r, 24); });
    } else if(groupReqBy === 'ep_campus'){
      h += renderEpGroups(ag, true);
    } else {
      h += renderEpGroups(ag, false);
    }
  }
  return h;
}

function renderEpGroups(ag, byCampus){
  const byEp = {};
  ag.reqs.forEach(r => { (byEp[r.ep] = byEp[r.ep] || []).push(r); });
  let h = '';
  Object.keys(byEp).sort().forEach(epName => {
    const group = byEp[epName];
    const key = ag.id + '::' + epName;
    const expanded = isEpExpanded(key);
    // Real sum across sized requests active that day, tracking whether the
    // group contains an Any (qty:0) request separately — confirmed rules:
    // displayed number = real sum (floored to 1 only if the group is
    // Any-only and would otherwise be 0); needed-for-colour = real sum + 1
    // per Any request in the group; "+" suffix whenever the group has one.
    const dayCounts = Array(DAYS).fill(0);
    const hasAnyOnDay = Array(DAYS).fill(false);
    group.forEach(r => {
      const isAny = requestIsAny(r);
      for(let i=0;i<DAYS;i++){
        if(!requestHasCellOnDay(r,i)) continue;
        if(isAny) hasAnyOnDay[i] = true;
        else dayCounts[i] += Math.max(requestOpen(r),0);
      }
    });
    h += `<div role="row" class="grid-row row-ep-group"><div role="rowheader" class="grid-cell agency-cell" style="padding-left:24px"><button type="button" class="toggle-btn" onclick="toggleEp('${key}')"><i class="fas fa-chevron-down${expanded?'':' collapsed'}"></i></button><span class="agency-name ep-name" title="${epName}">${epName}</span><span class="ep-count">${group.length} Request${group.length!==1?'s':''}</span></div>`;
    for(let i=0;i<DAYS;i++){
      const wknd = isWknd(getDate(i));
      const v = dayCounts[i];
      const dayHasAny = hasAnyOnDay[i];
      if(v > 0 || dayHasAny){
        const neededForColour = v + (dayHasAny ? 1 : 0);
        const cap = ag.caps ? ag.caps[i] : null;
        let ragCls = '';
        if(cap !== null && cap !== undefined){
          if(cap <= 0) ragCls = ' rag-red';
          else if(cap >= neededForColour) ragCls = ' rag-green';
          else ragCls = ' rag-amber';
        }
        const displayVal = dayHasAny ? Math.max(v,1) : v;
        h += `<div role="gridcell" class="grid-cell day-cell ep-group-cell${ragCls}${wknd?' weekend':''}"><span class="ep-day-count">${displayVal}${dayHasAny?'+':''}</span></div>`;
      } else {
        h += `<div role="gridcell" class="grid-cell day-cell ep-group-cell${wknd?' weekend':''}"></div>`;
      }
    }
    h += '</div>';
    if(expanded){
      if(byCampus){
        const byCampusMap = {};
        group.forEach(r => { (byCampusMap[r.campus||'—'] = byCampusMap[r.campus||'—'] || []).push(r); });
        Object.keys(byCampusMap).sort().forEach(campusName => {
          const campusReqs = byCampusMap[campusName];
          const campusKey = key + '::' + campusName;
          const campusExpanded = isEpExpanded(campusKey);
          h += `<div role="row" class="grid-row row-campus-group"><div role="rowheader" class="grid-cell agency-cell" style="padding-left:40px"><button type="button" class="toggle-btn" onclick="toggleEp('${campusKey}')"><i class="fas fa-chevron-down${campusExpanded?'':' collapsed'}"></i></button><span class="agency-name campus-name" title="${campusName}">${campusName}</span><span class="ep-count">${campusReqs.length} Request${campusReqs.length!==1?'s':''}</span></div>${Array(DAYS).fill('<div role="gridcell" class="grid-cell day-cell ep-group-cell"></div>').join('')}</div>`;
          if(campusExpanded) campusReqs.forEach(r => { h += renderRequestRow(r, 56); });
        });
      } else {
        group.forEach(r => { h += renderRequestRow(r, 43); });
      }
    }
  });
  return h;
}

function renderRequestRow(r, padLeft){
  padLeft = padLeft || 43;
  const isAny = requestIsAny(r);
  const open = requestOpen(r);
  const label1 = isAny ? `${r.allocated||0}/Any` : `${r.allocated||0}/${r.qty}`;
  const studentPart = r.reqType==='student' && r.studentName ? `<span class="request-student ng-star-inserted"> · ${r.studentName}</span>` : '';
  let h = `<div role="row" class="grid-row row-request"><div role="rowheader" class="grid-cell agency-cell request-cell" style="padding-left:${padLeft}px">
    <div class="request-label"><div class="request-line-1"><span class="request-line-1-main">
      <span class="request-badge" data-rid="${r.id}" onmouseenter="onChipEnter(event,'${r.id}')" onmouseleave="onChipLeave()">${r.reqNum}</span>
      <span class="request-qty"> · ${label1}</span>${studentPart}
      <span class="request-date"> · ${r.dates}</span>
    </span><span class="pending status-pill">Pending</span></div></div>
    <div class="request-row-actions" style="visibility:visible;display:flex;gap:4px;align-items:center;justify-content:flex-end;margin-left:auto">
      <button type="button" class="primary-action-button" style="height:22px;padding:0 8px;font-size:.75rem;background:#003179;color:#fff;border:none;border-radius:4px;cursor:pointer" onclick="reqPrimaryAction('${r.id}')">Process</button>
      <button type="button" class="secondary-actions" style="width:20px;height:20px;border:none;background:transparent;cursor:pointer;border-radius:4px" onclick="toggleReqMenu(event,'${r.id}')" aria-label="More Actions">&#8942;</button>
    </div>
  </div>`;
  for(let i=0;i<DAYS;i++){
    const wknd = isWknd(getDate(i));
    const hasCell = requestHasCellOnDay(r,i);
    let cellText = '';
    let ragCls = '';
    if(hasCell && (isAny || open > 0)){
      cellText = isAny ? 'Any' : `${open}`;
      const agency = AGENCIES.find(a => a.id === r._agencyId);
      const cap = getCapacityForRequest(agency, i);
      const neededHere = isAny ? 1 : open;
      if(cap !== null && cap !== undefined){
        if(cap <= 0) ragCls = ' rag-red';
        else if(cap >= neededHere) ragCls = ' rag-green';
        else ragCls = ' rag-amber';
      }
    }
    h += `<div role="gridcell" class="grid-cell day-cell request-day-cell${ragCls}${wknd?' weekend':''}${cellText?' clickable':''}">${cellText?`<span class="request-chip">${cellText}</span>`:''}</div>`;
  }
  return h + '</div>';
}

function render(){
  renderHeader();
  let h = renderRegionRow();
  AGENCIES.forEach(ag => { h += renderAgencyRow(ag); });
  document.getElementById('gridViewport').innerHTML = h;
  updateCountIndicator();
}

function updateCountIndicator(){
  const total = Object.keys(REQ_META).length;
  document.getElementById('gridCountIndicator').textContent = `Showing ${total} Pending of ${total} Requests`;
}

/* ─── Ellipsis menu — real production wording (Edit request / Reassign
   remaining / Reject entire request / Reject remaining request / Add
   comment). Any requests: once allocated>0, "Reject remaining request"
   becomes "Close request" in this same slot — confirmed Sep 14 catch-up.
   ─── */
function buildEllipsisItems(r){
  const isAny = requestIsAny(r);
  const showClose = isAny && (r.allocated||0) > 0;
  const items = [
    {label:'Edit request', action:'edit'},
    {label:'Reassign remaining', action:'reassign'},
    {label:'Reject entire request', action:'reject-entire', danger:true},
  ];
  items.push(showClose
    ? {label:'Close request', action:'close-request'}
    : {label:'Reject remaining request', action:'reject-remaining', danger:true});
  items.push({label:'Add comment', action:'comment'});
  return items;
}

function toggleReqMenu(e, reqId){
  e.stopPropagation();
  if(_activeReqMenu){ _activeReqMenu.remove(); _activeReqMenu=null; return; }
  const r = REQ_META[reqId];
  const btn = e.currentTarget;
  const rect = btn.getBoundingClientRect();
  const menu = document.createElement('div');
  menu.className = 'req-ctx-menu';
  buildEllipsisItems(r).forEach(item => {
    const el = document.createElement('div');
    el.className = 'req-ctx-menu-item' + (item.danger?' danger':'');
    el.textContent = item.label;
    el.onclick = (ev) => {
      ev.stopPropagation();
      if(item.action === 'close-request'){
        showToast(`Closed — ${r.reqNum} moved to Allocated (${r.allocated} processed).`);
      } else if(item.action === 'reassign'){
        openReassignPanel(r);
      } else {
        showToast(`${item.label}: ${r.reqNum}`);
      }
      menu.remove(); _activeReqMenu=null;
    };
    menu.appendChild(el);
  });
  menu.style.position='fixed';
  menu.style.top=(rect.bottom+2)+'px';
  menu.style.left=Math.min(rect.left, window.innerWidth-210)+'px';
  document.body.appendChild(menu);
  _activeReqMenu = menu;
}
document.addEventListener('click', ()=>{ if(_activeReqMenu){ _activeReqMenu.remove(); _activeReqMenu=null; } });

function reqPrimaryAction(reqId){ showToast(`Process: navigates to Process Request for ${REQ_META[reqId].reqNum}`); }

/* Reassign — Any requests: no quantity field (whole request moves), new
   request created at qty:1, original closes to Rejected (0 allocated) or
   Allocated (>=1 allocated) — matches Process Request exactly. */
function openReassignPanel(r){
  const isAny = requestIsAny(r);
  if(isAny){
    const hadAllocations = (r.allocated||0) > 0;
    const msg = hadAllocations
      ? `Reassigned — ${r.reqNum} is now Allocated. A new request (qty 1) would be created at the destination agency.`
      : `Reassigned — ${r.reqNum} is now Rejected (nothing had been allocated). A new request (qty 1) would be created at the destination agency.`;
    showToast(msg);
  } else {
    showToast(`Reassign remaining: ${r.reqNum} (${requestOpen(r)} remaining)`);
  }
}

function showToast(msg){
  let t = document.getElementById('rgToast');
  if(!t){
    t = document.createElement('div');
    t.id = 'rgToast';
    t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#00193e;color:#fff;padding:10px 18px;border-radius:6px;font-size:13px;z-index:3000;max-width:420px;text-align:center';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(t._hideTimer);
  t._hideTimer = setTimeout(()=>{ t.style.opacity='0'; }, 3500);
}

/* ─── Hover tooltip — Any requests: "Number of Placements" reads Any, the
   bar/text matches Process Request's confirmed wording ("N of Any
   placements processed"), and the "remaining" caption is dropped entirely
   (undefined for an open-ended request). ─── */
const tooltip = document.getElementById('reqTooltip');
let hideTimer = null;
function onChipEnter(e, reqId){
  clearTimeout(hideTimer);
  const r = REQ_META[reqId];
  if(!r) return;
  const isAny = requestIsAny(r);
  document.getElementById('ttId').textContent = r.reqNum;
  const sb = document.getElementById('ttStatus'); sb.textContent = 'Pending';
  document.getElementById('ttEPRow').style.display = r.reqType==='student' ? 'none' : '';
  document.getElementById('ttEP').textContent = `${r.ep} · ${r.campus}`;
  document.getElementById('ttDisc').textContent = r.discipline;
  document.getElementById('ttType').textContent = r.type;
  document.getElementById('ttYear').textContent = r.year;
  document.getElementById('ttQtyRow').style.display = r.reqType==='student' ? 'none' : '';
  document.getElementById('ttQty').textContent = isAny ? 'Any' : r.qty;
  document.getElementById('ttDur').textContent = r.dur || '—';
  document.getElementById('ttDates').textContent = r.dates;

  const progressWrap = document.getElementById('ttProgressWrap');
  const remainingLbl = document.getElementById('ttRemainingLbl');
  if(isAny && r.allocated > 0){
    document.getElementById('ttProgressFill').style.width = '100%';
    document.getElementById('ttAllocatedLbl').textContent = `${r.allocated} of Any placements processed`;
    remainingLbl.style.display = 'none';
    progressWrap.style.display = '';
  } else if(!isAny && r.allocated > 0 && r.allocated < r.qty){
    const remaining = r.qty - r.allocated;
    const pct = Math.round((r.allocated / r.qty) * 100);
    document.getElementById('ttProgressFill').style.width = pct+'%';
    document.getElementById('ttAllocatedLbl').textContent = `${r.allocated} of ${r.qty} allocated`;
    remainingLbl.textContent = `${remaining} remaining`;
    remainingLbl.style.display = '';
    progressWrap.style.display = '';
  } else {
    progressWrap.style.display = 'none';
  }
  posTooltip(e);
  tooltip.classList.add('visible');
}
function onChipLeave(){ hideTimer = setTimeout(()=>tooltip.classList.remove('visible'), 300); }
tooltip.addEventListener('mouseenter', ()=>clearTimeout(hideTimer));
tooltip.addEventListener('mouseleave', ()=>{ hideTimer = setTimeout(()=>tooltip.classList.remove('visible'), 150); });
function posTooltip(e){
  const TW=280, TH=260, vw=window.innerWidth, vh=window.innerHeight;
  let x = e.clientX + 14, y = e.clientY + 14;
  if(x+TW > vw-8) x = e.clientX - TW - 10;
  if(y+TH > vh-8) y = e.clientY - TH - 10;
  tooltip.style.left = x+'px'; tooltip.style.top = y+'px';
}

// Default: EP grouping expanded for the two demo agencies so the fixes are visible on load
expandedAgencies = { 'sa-c': true, 'g03': true };
expandedEpGroups = { 'g03::ACU': true, 'g03::Canberra': true };
render();
</script>
